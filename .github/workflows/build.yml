name: Build IPA

on:
  push:
    branches: [erome27]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar archivos
        run: |
          cd "$GITHUB_WORKSPACE/ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset"
          if [ -f "AppIcon-1024.png.PNG" ]; then mv "AppIcon-1024.png.PNG" "AppIcon-1024.png"; fi
          sips -z 1024 1024 "AppIcon-1024.png" >/dev/null
          cd "$GITHUB_WORKSPACE/ThreeOneOSFive/Resources/Patches"
          rm -f .keep
          first=$(ls *.mp3 2>/dev/null | head -n1)
          if [ -n "$first" ]; then mv "$first" levi.mp3; fi
          ls -la

      - name: Mostrar Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Empaquetar IPA
        run: |
          mkdir -p out/Payload
          cp -R build/3105.app out/Payload/
          cd out
          zip -qry ../EroMe.ipa Payload
          cd ..
          ls -la EroMe.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: EroMe-ipa
          path: EroMe.ipa
          retention-days: 7
